<div class="accordion" id="postsAccordion">
  <div class="accordion-item" *ngFor="let post of posts">
    <h2 class="accordion-header">
      <button class="accordion-button" type="button" data-bs-toggle="collapse"
              [attr.data-bs-target]="'#collapse' + post.id">
        {{ post.titre }}
      </button>
    </h2>
    <div [id]="'collapse' + post.id" class="accordion-collapse collapse"
         data-bs-parent="#postsAccordion">
      <div class="accordion-body">
        {{ post.contenu }}
      </div>
    </div>
  </div>
</div>
